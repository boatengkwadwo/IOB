<!DOCTYPE html>
<html>
<head>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple.css">
<style>
:root{--theme-color:#0d47a1; --sidebar-background:#0a1931; --sidebar-nav-link-color:#cbd5e0; --sidebar-nav-link-color--active:#ffca28;}

.cover h1{color:#fff !important;} .cover blockquote{color:#ffca28 !important;}
</style>
</head>
<body>
<div id="app">Loading University Portal...</div>
<script>
window.$docsify={

 repo: 'boatengkwadwo/IOB',
 loadSidebar: true,
 loadNavbar: true,
 coverpage: true,
 search: {placeholder: 'Search courses...', noData: 'No results!'},
}
</script>
<script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
<script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
